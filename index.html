<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arthas 4.0.4 文档</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="version-switcher">
        <div class="version-dropdown">
          <button id="versionButton">切换版本 (当前: 4.0.4)</button>
          <div id="versionDropdown" class="dropdown-content">
            <a href="#" data-version="4.0.4">Arthas 4.0.4</a>
          </div>
        </div>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索命令..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
      </div>
      <div class="menu" id="menu"></div>
    </div>
    <div class="resizer" id="resizer"></div>
    <div class="content-container">
      <div id="notification" class="notification"></div>
      <div class="content" id="content"></div>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
